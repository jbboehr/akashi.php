name: ci

on:
    push:
        branches:
            - master
            - develop
            - ci
    pull_request:
        branches:
            - master

permissions:
    contents: read

jobs:
    php-baseline:
        name: Conventional / ${{ matrix.name }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: PHPUnit
                      command:
                          mkdir -p build/test-results && composer test -- --log-junit build/test-results/phpunit.xml
                    - name: PHPStan
                      command: composer analyse
                    - name: php-cs-fixer
                      command: composer cs
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: dom
                  ini-values: memory_limit=2G
                  php-version: "8.2"
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php-8.2-composer-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-8.2-composer-
                      ${{ runner.os }}-php-composer-

            - name: Install locked dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Run ${{ matrix.name }}
              id: validation
              run: ${{ matrix.command }}

            - name: Upload PHPUnit test report
              if:
                  ${{ !cancelled() && matrix.name == 'PHPUnit' && (steps.validation.conclusion == 'success' ||
                  steps.validation.conclusion == 'failure') }}
              uses: actions/upload-artifact@v7
              with:
                  name: phpunit-junit-linux-php82
                  path: build/test-results/phpunit.xml
                  if-no-files-found: error
                  retention-days: 14

    nix-matrix:
        name: Generate Nix matrix
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.matrix.outputs.matrix }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install Nix
              uses: cachix/install-nix-action@v31
              with:
                  github_access_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate matrix from flake outputs
              id: matrix
              shell: bash
              run: |
                  matrix_path=$(nix build -L --no-link --print-out-paths .#github-actions-matrix)
                  matrix=$(<"$matrix_path")
                  echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

    nix-build:
        name: Nix / ${{ matrix.name }} (${{ matrix.system }})
        needs: nix-matrix
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.nix-matrix.outputs.matrix) }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install Nix
              uses: cachix/install-nix-action@v31
              with:
                  github_access_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Restore and save Nix store
              uses: nix-community/cache-nix-action@v7
              with:
                  primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/composer.lock') }}
                  restore-prefixes-first-match: |
                      nix-${{ runner.os }}-
                  gc-max-store-size-linux: 2G

            - name: Build ${{ matrix.attr }}
              shell: bash
              env:
                  NIX_ATTR: ${{ matrix.attr }}
              run: |
                  set +e
                  nix build -L ".#$NIX_ATTR" 2>&1 | tee nix-build.log
                  status=${PIPESTATUS[0]}
                  set -e

                  if ((status != 0)); then
                      tools/report-nix-vendor-hash nix-build.log "$GITHUB_STEP_SUMMARY" || true
                  fi

                  exit "$status"
