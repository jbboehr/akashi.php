name: ci

on:
    push:
        branches:
            - master
            - develop
            - ci
    pull_request:
        branches:
            - master

permissions:
    contents: read

jobs:
    nix:
        name: Nix
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install Nix
              uses: cachix/install-nix-action@v31
              with:
                  github_access_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Restore and save Nix store
              uses: nix-community/cache-nix-action@v7
              with:
                  primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
                  restore-prefixes-first-match: nix-${{ runner.os }}-
                  gc-max-store-size-linux: 2G

            - name: Check flake
              run: nix flake check --print-build-logs

    php:
        name: PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php-version:
                    - "8.1"
                    - "8.2"
                    - "8.3"
                    - "8.4"
                    - "8.5"
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: pcov
                  extensions: dom
                  ini-values: memory_limit=2G
                  php-version: ${{ matrix.php-version }}
                  tools: composer:v2

            - name: Validate Composer files
              run: composer composer:validate

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-composer-
                      ${{ runner.os }}-php-composer-

            - name: Resolve PHP 8.1-compatible dependencies
              if: matrix.php-version == '8.1'
              run: composer update --prefer-dist --no-interaction --no-progress

            - name: Install locked dependencies
              if: matrix.php-version != '8.1'
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Check whitespace
              run: git diff --check

            - name: Run PHP-CS-Fixer
              if: matrix.php-version == '8.1'
              run: composer cs

            - name: Run PHPStan
              run: composer analyse

            - name: Run PHPUnit
              run: composer test

            - name: Verify PHPUnit 10 compatibility
              if: matrix.php-version == '8.1'
              run: composer test:phpunit10

            - name: Verify PHPStan 1 compatibility
              if: matrix.php-version == '8.1'
              run: composer test:phpstan1

            - name: Verify Composer package archive
              if: matrix.php-version == '8.2'
              run: composer package:check

            - name: Verify ParaTest compatibility
              if: matrix.php-version == '8.2'
              run: composer test:parallel

            - name: Smoke-test executable
              run: bin/akashi

    lowest-dependencies:
        name: Lowest dependencies / PHP 8.1
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: dom
                  ini-values: memory_limit=2G
                  php-version: "8.1"
                  tools: composer:v2

            - name: Validate Composer files
              run: composer composer:validate

            - name: Install lowest supported dependencies
              run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress

            - name: Run PHPStan
              run: composer analyse

            - name: Run PHPUnit
              run: composer test

    mutation:
        name: Mutation testing
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: pcov
                  extensions: dom
                  php-version: "8.2"
                  tools: composer:v2

            - name: Install dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Run mutation tests
              run: composer infection:ci
